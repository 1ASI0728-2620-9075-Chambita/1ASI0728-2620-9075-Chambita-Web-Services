spring:
  application:
    name: chambita-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chambita}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    schemas: iam,profiles,projects,engagements,payments,reputation,certification
    create-schemas: true
    default-schema: public
  messages:
    basename: messages
    fallback-to-system-locale: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP is optional (codes go to the log without it), so it must not mark the API as DOWN.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

chambita:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-hours: 24
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jobs:
    secret: ${CRON_SECRET}
  mail:
    from: ${MAIL_FROM:no-reply@chambita.pe}
  payments:
    service-fee-rate: ${SERVICE_FEE_RATE:0.10}
  engagements:
    auto-approval-days: 7
  blockchain:
    rpc-url: ${ALCHEMY_SEPOLIA_URL:}
    issuer-private-key: ${ISSUER_PRIVATE_KEY:}
    contract-address: ${CERTIFICATE_CONTRACT_ADDRESS:}
    chain-id: 11155111
  certification:
    portal-base-url: ${VERIFICATION_PORTAL_URL:http://localhost:5500}
    max-attempts: 3
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:chambita-files}
---
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
