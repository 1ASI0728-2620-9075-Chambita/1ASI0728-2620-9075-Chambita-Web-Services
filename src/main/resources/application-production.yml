# Production on Vercel + Supabase. The application uses the transaction pooler (DATABASE_URL, port 6543,
# many short-lived serverless instances); Flyway needs session-level advisory locks, so it uses the
# session pooler (FLYWAY_DATABASE_URL, port 5432).
spring:
  main:
    lazy-initialization: true
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:3}
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false
  flyway:
    url: ${FLYWAY_DATABASE_URL}
    user: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
